[package]
name = "forge-video"
version = "0.1.0"
description = "ForgeVideo — a barebones Mac video editor"
authors = ["Nina Palumbo"]
edition = "2021"

[lib]
name = "forge_video_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "rt-multi-thread", "macros", "io-util", "fs"] }
thiserror = "2"
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
which = "7"
dirs = "6"
log = "0.4"
env_logger = "0.11"
tauri-plugin-clipboard-manager = "2"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Local patch of wry 0.55.1: guard a nil pasteboard property list in the macOS drag-drop
# handler (vendor/wry/src/wkwebview/drag_drop.rs) that otherwise panics the app mid-drag.
[patch.crates-io]
wry = { path = "vendor/wry" }
